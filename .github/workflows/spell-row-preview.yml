name: Spell Row Preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  render:
    name: Render spell row previews
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Render spell row previews
        run: ./gradlew :app:updateDebugScreenshotTest --tests '*SpellRow*' --stacktrace

      - name: Upload spell row previews
        uses: actions/upload-artifact@v4
        with:
          name: spell-row-previews
          path: app/src/screenshotTestDebug/reference
          if-no-files-found: error
