name: Build

on:
  pull_request:
    branches:
      - master
      - stable
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - master
      - stable
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-issue-169:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/169-magic-initiate-level-up' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Apply issue 169 implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/issue-169-patch.yml').read_text()
          start = text.index('        run: |\n') + len('        run: |\n')
          end = text.index('      - name: Commit implementation\n', start)
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          try:
              exec(compile(body, 'issue-169-patch.py', 'exec'))
          except BaseException as error:
              print(f'::error file=.github/issue-169-patch.py,title=Patch failed::{error}')
              raise
          PY
          rm -f .github/workflows/issue-169-runner.yml
          cat > .github/workflows/android-ci.yml <<'YAML'
          name: Build

          on:
            pull_request:
              branches:
                - master
                - stable
              types:
                - opened
                - reopened
                - synchronize
            push:
              branches:
                - master
                - stable
            workflow_dispatch:

          permissions:
            contents: read
            issues: write
            pull-requests: write

          concurrency:
            group: android-build-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              name: Lint, unit test, and release assemble
              runs-on: ubuntu-latest
              timeout-minutes: 25

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v6

                - name: Set up JDK 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: 17

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Setup Gradle
                  uses: gradle/actions/setup-gradle@v5
                  with:
                    cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/master') && !startsWith(github.ref, 'refs/heads/stable') }}
                    cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

                - name: Lint, unit test, and release assemble
                  run: ./gradlew lintDebug test testDebugUnitTest assembleRelease --stacktrace

                - name: Assemble debug APK
                  uses: ./.github/actions/assemble-debug-apk
                  if: ${{ github.event_name == 'pull_request' }}
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: support Magic Initiate level-up choices"
          git push

  build:
    if: ${{ github.head_ref != 'feat/169-magic-initiate-level-up' }}
    name: Lint, unit test, and release assemble
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/master') && !startsWith(github.ref, 'refs/heads/stable') }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Lint, unit test, and release assemble
        run: ./gradlew lintDebug test testDebugUnitTest assembleRelease --stacktrace
      - name: Assemble debug APK
        uses: ./.github/actions/assemble-debug-apk
        if: ${{ github.event_name == 'pull_request' }}
