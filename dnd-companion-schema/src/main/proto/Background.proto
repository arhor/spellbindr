syntax = "proto3";

package dnd.companion.api.v1;

import "catalog.proto";
import "choice.proto";
import "effect.proto";
import "generic_info.proto";

option java_multiple_files = true;
option java_package = "io.github.arhor.dnd.companion.api.v1";

message Background {
  string id = 1;
  string name = 2;
  GenericInfo feature = 3;
  repeated Effect effects = 4;
  optional Choice language_choice = 5;
  optional Choice equipment_choice = 6;
  optional Choice personality_traits = 7;
  optional Choice ideals = 8;
  optional Choice bonds = 9;
  optional Choice flaws = 10;
  ResourceMetadata metadata = 11;
}
