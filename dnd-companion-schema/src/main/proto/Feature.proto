syntax = "proto3";

package dnd.companion.api.v1;

option java_multiple_files = true;
option java_package = "io.github.arhor.dnd.companion.api.v1";

import "Choice.proto";
import "Catalog.proto";
import "EntityReference.proto";

message Feature {
  string id = 1;
  string name = 2;
  repeated string desc = 3;
  optional EntityReference character_class = 4;
  optional int32 level = 5;
  optional Choice choice = 6;
  ResourceMetadata metadata = 7;
}
