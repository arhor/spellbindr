syntax = "proto3";

package dnd.companion.api.v1;

option java_multiple_files = true;
option java_package = "io.github.arhor.dnd.companion.api.v1";

import "SrdReference.proto";
import "Catalog.proto";

message SrdRule {
  string name = 1;
  string index = 2 [deprecated = true];
  string desc = 3;
  repeated SrdReference subsections = 4;
  string url = 5;
  string id = 6;
  ResourceMetadata metadata = 7;
}
