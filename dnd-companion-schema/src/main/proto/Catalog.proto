syntax = "proto3";

package dnd.companion.api.v1;

option java_multiple_files = true;
option java_package = "io.github.arhor.dnd.companion.api.v1";

import "google/protobuf/timestamp.proto";

message CatalogSelection {
  string ruleset_id = 1;
  repeated string source_ids = 2;
}

message CatalogReadContext {
  CatalogSelection selection = 1;
  optional string snapshot_id = 2;
}

message ResourceMetadata {
  string ruleset_id = 1;
  repeated string source_ids = 2;
}

message Ruleset {
  string id = 1;
  string name = 2;
  repeated string default_source_ids = 3;
}

message ContentSource {
  string id = 1;
  string ruleset_id = 2;
  string name = 3;
  optional string license = 4;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_ABILITY = 1;
  RESOURCE_KIND_ALIGNMENT = 2;
  RESOURCE_KIND_BACKGROUND = 3;
  RESOURCE_KIND_CHARACTER_CLASS = 4;
  RESOURCE_KIND_FEAT = 5;
  RESOURCE_KIND_FEATURE = 6;
  RESOURCE_KIND_LANGUAGE = 7;
  RESOURCE_KIND_PROFICIENCY = 8;
  RESOURCE_KIND_RACE = 9;
  RESOURCE_KIND_TRAIT = 10;
  RESOURCE_KIND_SPELL = 11;
  RESOURCE_KIND_MAGIC_SCHOOL = 12;
  RESOURCE_KIND_EQUIPMENT = 13;
  RESOURCE_KIND_MAGIC_ITEM = 14;
  RESOURCE_KIND_WEAPON_PROPERTY = 15;
  RESOURCE_KIND_MONSTER = 16;
  RESOURCE_KIND_CONDITION = 17;
  RESOURCE_KIND_RULE_SECTION = 18;
  RESOURCE_KIND_SRD_RULE = 19;
}

message CollectionRevision {
  ResourceKind resource_kind = 1;
  string revision = 2;
  string content_hash = 3;
  int32 record_count = 4;
}

message CatalogManifest {
  CatalogSelection resolved_selection = 1;
  string snapshot_id = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated CollectionRevision collections = 4;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;
  int32 total_size = 2;
}

message ListRulesetsRequest { PageRequest page = 1; }
message ListRulesetsResponse { repeated Ruleset rulesets = 1; PageInfo page_info = 2; }
message ListContentSourcesRequest { string ruleset_id = 1; PageRequest page = 2; }
message ListContentSourcesResponse { repeated ContentSource sources = 1; PageInfo page_info = 2; }
message GetCatalogManifestRequest { CatalogSelection selection = 1; }
message GetCatalogManifestResponse { CatalogManifest manifest = 1; }
