syntax = "proto3";

package dnd.companion.api.v1;

import "catalog.proto";

option java_multiple_files = true;
option java_package = "io.github.arhor.dnd.companion.api.v1";

message Ability {
  string id = 1;
  string display_name = 2;
  repeated string descriptions = 3 [json_name = "description"];
  ResourceMetadata metadata = 4;
}
